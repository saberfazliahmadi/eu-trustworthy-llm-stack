[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-llm"
version = "1.0.0"
description = "EU high-risk AI career coaching & HR policy assistant wrapped in a trustworthiness engineering stack (RAG, guardrails, safety stack, LLM-as-a-judge, fairness, robustness, red teaming)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Saber Fazliahmadi" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "torch>=2.2",
]

[project.optional-dependencies]
live = ["openai>=1.30"]
hf = ["transformers>=4.40", "sentence-transformers>=2.7"]
dev = ["pytest>=8.0", "openai>=1.30", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]

[project.scripts]
trust-llm = "trust_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trust_llm = ["guardrails/policies.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
