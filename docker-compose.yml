services:
  api:
    build: .
    image: eu-trustworthy-llm-stack:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    volumes:
      - ./reports:/app/reports

  audit:
    image: eu-trustworthy-llm-stack:latest
    depends_on: [api]
    command: ["python", "-m", "trust_llm.cli", "run-all"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./reports:/app/reports
    profiles: ["audit"]

  # Optional: fully local open-weight model via Ollama (OpenAI-compatible endpoint).
  # Then set LLM_PROVIDER=openai, OPENAI_BASE_URL=http://ollama:11434/v1, OPENAI_API_KEY=ollama, LLM_MODEL=llama3.1
  ollama:
    image: ollama/ollama:0.4.7
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    profiles: ["local-llm"]

volumes:
  ollama:
